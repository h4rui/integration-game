<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#d71920" />
  <title>桃鉄ワールド 縛りルーレット</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="train-mark">🚂</div>
      <h1>桃鉄ワールド<br><span>縛りルーレット</span></h1>
      <p>1年ごとに新しい縛りを抽選！</p>
    </header>

    <section id="screen-start" class="screen active">
      <button class="primary big" id="startBtn">スタート</button>
    </section>

    <section id="screen-players" class="screen">
      <h2>人数を選択</h2>
      <div class="choice-grid" id="playerChoices">
        <button data-count="2">2人</button>
        <button data-count="3">3人</button>
        <button data-count="4">4人</button>
      </div>
      <div class="nav-row">
        <button class="secondary" data-back="screen-start">戻る</button>
      </div>
    </section>

    <section id="screen-names" class="screen">
      <h2>名前を入力</h2>
      <div id="nameInputs" class="stack"></div>
      <div class="nav-row">
        <button class="secondary" data-back="screen-players">戻る</button>
        <button class="primary" id="toShuffleBtn">次へ</button>
      </div>
    </section>

    <section id="screen-shuffle" class="screen">
      <h2>順番シャッフル</h2>
      <div id="shuffleResult" class="result-card muted">シャッフルボタンを押してください</div>
      <button class="primary big" id="shuffleBtn">シャッフルして読み上げ</button>
      <div class="nav-row">
        <button class="secondary" data-back="screen-names">戻る</button>
        <button class="primary" id="toYearsBtn" disabled>次へ</button>
      </div>
    </section>

    <section id="screen-years" class="screen">
      <h2>年数を選択</h2>
      <div class="choice-grid years" id="yearChoices">
        <button data-years="10">10年</button>
        <button data-years="20">20年</button>
        <button data-years="30">30年</button>
        <button data-years="50">50年</button>
        <button data-years="100">100年</button>
      </div>
      <label class="custom-year">
        その他
        <input id="customYears" type="number" min="1" max="999" placeholder="年数" inputmode="numeric">
      </label>
      <div class="nav-row">
        <button class="secondary" data-back="screen-shuffle">戻る</button>
      </div>
    </section>

    <section id="screen-game" class="screen">
      <div class="year-badge"><span id="currentYear">1</span>年目</div>
      <div id="roulette" class="roulette">
        <div class="roulette-inner">
          <div class="roulette-label">今年の縛り</div>
          <div id="ruleText" class="rule-text">回すボタンを押してください</div>
        </div>
      </div>

      <button class="primary big" id="spinBtn">回す</button>

      <div class="game-actions">
        <button class="secondary" id="historyBtn">履歴</button>
        <button class="primary" id="nextYearBtn" disabled>次の年へ</button>
      </div>

      <div id="historyPanel" class="history-panel hidden">
        <h3>縛り履歴</h3>
        <ol id="historyList"></ol>
      </div>
    </section>

    <section id="screen-finish" class="screen">
      <div class="finish-icon">🏆</div>
      <h2>ゲーム終了！</h2>
      <p id="finishText"></p>
      <button class="primary big" id="restartBtn">最初から</button>
    </section>
  </main>

  <footer>個人利用向け・端末内で動作します</footer>

  <script src="app.js"></script>
</body>
</html>
