<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>会社経営シミュレーション</title>
<style>
body{margin:0;background:#0b1020;color:#fff;font-family:system-ui,sans-serif}
main{max-width:650px;margin:60px auto;padding:20px}
.card{background:#151d33;border:1px solid #34405f;border-radius:14px;padding:24px}
input{width:100%;padding:14px;box-sizing:border-box;background:#0d1427;color:#fff;border:1px solid #526080;border-radius:8px;font-size:16px}
button{margin-top:18px;width:100%;padding:14px;background:#4f7cff;color:#fff;border:0;border-radius:8px;font-weight:700;font-size:16px;cursor:pointer}
table{width:100%;margin-top:20px;border-collapse:collapse}td{padding:10px;border-bottom:1px solid #303b59}td:first-child{color:#aeb8d2;width:35%}
</style>
</head>
<body>
<main>
<div class="card">
<h1>会社経営シミュレーション</h1>
<p>会社名を入力してゲームを開始してください。</p>
<form action="game.html" method="get">
<label for="name">会社名</label>
<input id="name" name="name" maxlength="40" required placeholder="会社名を入力" autocomplete="off">
<table>
<tr><td>本社</td><td>龍間</td></tr>
<tr><td>通貨</td><td>銭</td></tr>
<tr><td>開始資金</td><td>5,000,000 銭</td></tr>
<tr><td>主力商品</td><td>未設定</td></tr>
</table>
<button type="submit">プレイ開始</button>
</form>
</div>
</main>
</body>
</html>
