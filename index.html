<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>モンスト反射ガイド</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,sans-serif;background:#111827;color:#fff}
body{display:flex;flex-direction:column;min-height:100dvh}
header{padding:10px 12px;font-weight:700;font-size:17px;background:#1f2937}
.controls{display:flex;gap:8px;flex-wrap:wrap;padding:10px;background:#1f2937}
button,.filelabel{border:0;border-radius:9px;padding:10px 12px;background:#374151;color:white;font-size:14px;font-weight:600}
button.active{background:#2563eb}.filelabel{background:#0f766e}
input[type=file]{display:none}
#stage{position:relative;flex:1;min-height:220px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#030712;touch-action:none}
canvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;touch-action:none}
#hint{position:absolute;left:10px;right:10px;bottom:10px;text-align:center;color:#d1d5db;font-size:12px;text-shadow:0 1px 3px #000;pointer-events:none}
#stage.expanded{position:fixed;z-index:20;inset:0;width:100vw;height:100dvh;min-height:0;padding:58px 0 0;background:#000}\n#stage.expanded canvas{max-height:calc(100dvh - 58px)}\nbody:has(#stage.expanded) .controls{position:fixed;z-index:30;top:38px;left:0;right:0}
#stage.expanded canvas{max-width:100vw;max-height:100dvh}
#stage.expanded #hint{bottom:max(12px,env(safe-area-inset-bottom))}
#expandBtn{margin-left:auto;background:#7c3aed}
@media(max-width:480px){button,.filelabel{padding:9px 10px;font-size:13px}.controls{gap:6px}}
</style>
</head>
<body>
<header>モンスト反射ガイド</header>
<div class="controls">
<label class="filelabel" for="photo">写真を選択</label><input id="photo" type="file" accept="image/*">
<button id="areaBtn" disabled>反射</button>
<button id="lineBtn" disabled>引っ張り</button>
<button id="clearBtn" disabled>線を消す</button>
<button id="expandBtn" disabled>画面を拡大</button>
</div>
<div id="stage">
<canvas id="canvas" width="1" height="1"></canvas>
<div id="hint">まずモンストのスクショを選択してください</div>
</div>
<script>
(() => {
 const input=document.getElementById('photo'), canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
 const stage=document.getElementById('stage'), hint=document.getElementById('hint');
 const areaBtn=document.getElementById('areaBtn'), lineBtn=document.getElementById('lineBtn'), clearBtn=document.getElementById('clearBtn'), expandBtn=document.getElementById('expandBtn');
 let img=null, mode='line', area=null, path=null, drag=null, baseScale=1, offsetX=0, offsetY=0;
 function fitCanvas(){
   if(!img)return;
   const maxW=stage.clientWidth, maxH=stage.clientHeight;
   const s=Math.min(maxW/img.width,maxH/img.height);
   canvas.width=img.width; canvas.height=img.height;
   canvas.style.width=(img.width*s)+'px'; canvas.style.height=(img.height*s)+'px';
   baseScale=s; draw();
 }
 function draw(){
   if(!img)return;
   ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0);
   if(area){ctx.save();ctx.strokeStyle='#00e676';ctx.lineWidth=Math.max(3,canvas.width/500);ctx.setLineDash([12,7]);ctx.strokeRect(area.x,area.y,area.w,area.h);ctx.restore();}
   if(path){ctx.save();ctx.strokeStyle='#ff1744';ctx.lineWidth=Math.max(4,canvas.width/450);ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();path.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();ctx.restore();}
   if(drag && mode==='area'){ctx.save();ctx.strokeStyle='#00e676';ctx.lineWidth=4;ctx.setLineDash([10,6]);ctx.strokeRect(drag.x,drag.y,drag.w,drag.h);ctx.restore();}
 }
 input.addEventListener('change',e=>{
   const file=e.target.files&&e.target.files[0]; if(!file)return;
   if(!file.type.startsWith('image/')){hint.textContent='画像ファイルを選んでください';return;}
   const url=URL.createObjectURL(file), next=new Image();
   next.onload=()=>{img=next;area=null;path=null;drag=null;mode='line';areaBtn.disabled=lineBtn.disabled=clearBtn.disabled=expandBtn.disabled=false;areaBtn.classList.remove('active');lineBtn.classList.add('active');hint.textContent='「反射」を押すと反射範囲を自動設定します';fitCanvas();URL.revokeObjectURL(url);};
   next.onerror=()=>{hint.textContent='写真を読み込めませんでした。別の画像を選んでください';URL.revokeObjectURL(url);};
   next.src=url;
 });
 function point(e){const r=canvas.getBoundingClientRect();return {x:Math.max(0,Math.min(canvas.width,(e.clientX-r.left)*canvas.width/r.width)),y:Math.max(0,Math.min(canvas.height,(e.clientY-r.top)*canvas.height/r.height))};}
 function reflectedPath(start,end,box){
   const dx=end.x-start.x,dy=end.y-start.y,len=Math.hypot(dx,dy);if(!len)return [start];
   const ux=dx/len,uy=dy/len,pts=[start];let x=start.x,y=start.y,vx=ux,vy=uy;
   for(let i=0;i<11;i++){
     let tx=Infinity,ty=Infinity;
     if(vx>0)tx=(box.x+box.w-x)/vx;else if(vx<0)tx=(box.x-x)/vx;
     if(vy>0)ty=(box.y+box.h-y)/vy;else if(vy<0)ty=(box.y-y)/vy;
     const t=Math.min(tx>1e-6?tx:Infinity,ty>1e-6?ty:Infinity);
     if(!Number.isFinite(t))break;
     x+=vx*t;y+=vy*t;pts.push({x,y});
     if(pts.length>10)break;
     if(Math.abs(tx-ty)<1e-5){vx=-vx;vy=-vy;}else if(tx<ty)vx=-vx;else vy=-vy;
   }
   return pts;
 }
 canvas.addEventListener('pointerdown',e=>{if(!img)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);const p=point(e);drag={x:p.x,y:p.y,w:0,h:0,start:p};});
 canvas.addEventListener('pointermove',e=>{if(!drag)return;const p=point(e);drag.w=p.x-drag.x;drag.h=p.y-drag.y;draw();});
 canvas.addEventListener('pointerup',e=>{
   if(!drag)return;const p=point(e);
   if(mode==='area'){area={x:Math.min(drag.x,p.x),y:Math.min(drag.y,p.y),w:Math.abs(p.x-drag.x),h:Math.abs(p.y-drag.y)};if(area.w<10||area.h<10)area={x:0,y:0,w:canvas.width,h:canvas.height};path=null;hint.textContent='反射範囲を手動設定しました。「引っ張り」で軌道を確認できます';}
   else if(mode==='line'){if(!area){hint.textContent='先に「反射」を押してください';}else{const s=drag.start;const clamped={x:Math.max(area.x,Math.min(area.x+area.w,p.x)),y:Math.max(area.y,Math.min(area.y+area.h,p.y))};path=reflectedPath(s,clamped,area);hint.textContent='赤い線が反射軌道です（最大10回反射）';}}
   drag=null;draw();
 });
 areaBtn.onclick=()=>{if(!img)return;mode='area';area={x:Math.round(canvas.width*0.025),y:Math.round(canvas.height*0.025),w:Math.round(canvas.width*0.95),h:Math.round(canvas.height*0.95)};path=null;areaBtn.classList.add('active');lineBtn.classList.remove('active');hint.textContent='反射範囲を自動設定しました。緑の枠をドラッグして調整できます';draw();};
 lineBtn.onclick=()=>{if(!img)return;if(!area){hint.textContent='先に「反射」を押してください';return;}mode='line';lineBtn.classList.add('active');areaBtn.classList.remove('active');hint.textContent='始点から進行方向へドラッグすると反射軌道を表示します';};
 clearBtn.onclick=()=>{path=null;draw();hint.textContent='線を消しました';};
 expandBtn.onclick=()=>{stage.classList.toggle('expanded');expandBtn.textContent=stage.classList.contains('expanded')?'拡大を戻す':'画面を拡大';requestAnimationFrame(fitCanvas);};
 window.addEventListener('resize',()=>{if(img)fitCanvas();});
})();
</script>
</body>
</html>
