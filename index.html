<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>企業経営シミュレーター</title>
<style>
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f4f6f8;color:#17202a}
.wrap{max-width:980px;margin:40px auto;padding:20px}.card{background:white;border:1px solid #dfe3e8;border-radius:14px;padding:28px;box-shadow:0 3px 14px #0000000d}
h1{margin-top:0}input,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #cbd2d9}input{width:100%;box-sizing:border-box;margin:8px 0 16px}button{cursor:pointer;background:#1769aa;color:white;border:0}.note{color:#5f6b76}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>企業経営シミュレーター</h1>
<p class="note">龍間で会社を設立し、素材を仕入れ、商品を生産・販売して会社を成長させます。</p>
<form action="game.html" method="get">
<label>会社名</label>
<input name="name" required maxlength="40" placeholder="例：はるな工業">
<button type="submit">ゲーム開始</button>
</form>
</div></div>
</body>
</html>
